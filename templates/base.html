<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Analytics Platform{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bs-body-bg);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .sidebar {
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding-top: 60px;
            border-right: 1px solid var(--bs-border-color);
            background-color: var(--bs-tertiary-bg);
        }
        .main-content {
            margin-left: 250px;
            padding: 20px;
            padding-top: 60px;
        }
        .navbar {
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--bs-border-color);
        }
        .nav-link.active {
            font-weight: bold;
            color: var(--bs-primary) !important;
            background-color: rgba(var(--bs-primary-rgb), 0.1);
            border-radius: 5px;
        }
        .card {
            border: 1px solid var(--bs-border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            transition: transform 0.2s ease-in-out;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .theme-toggle {
            cursor: pointer;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="#">
                <i class="fas fa-chart-line me-2"></i>WebTracker Analytics
            </a>
            <div class="d-flex align-items-center">
                <i class="fas fa-sun theme-toggle me-3 fs-5" id="theme-toggle-icon"></i>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar d-none d-md-block">
        <div class="px-3">
            <ul class="nav flex-column gap-2">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'dashboard:home' %}">
                        <i class="fas fa-tachometer-alt me-2"></i> Overview
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'audience' %}active{% endif %}" href="{% url 'dashboard:audience' %}">
                        <i class="fas fa-users me-2"></i> Audience
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'behavior' %}active{% endif %}" href="{% url 'dashboard:behavior' %}">
                        <i class="fas fa-route me-2"></i> Behavior
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'time' %}active{% endif %}" href="{% url 'dashboard:time' %}">
                        <i class="fas fa-clock me-2"></i> Trends
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'events' %}active{% endif %}" href="{% url 'dashboard:events' %}">
                        <i class="fas fa-mouse-pointer me-2"></i> Events
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Theme Toggle Logic -->
    <script>
        const themeToggle = document.getElementById('theme-toggle-icon');
        const html = document.documentElement;
        
        themeToggle.addEventListener('click', () => {
            if (html.getAttribute('data-bs-theme') === 'dark') {
                html.setAttribute('data-bs-theme', 'light');
                themeToggle.classList.remove('fa-sun');
                themeToggle.classList.add('fa-moon');
            } else {
                html.setAttribute('data-bs-theme', 'dark');
                themeToggle.classList.remove('fa-moon');
                themeToggle.classList.add('fa-sun');
            }
        });
    </script>
    
    {% load static %}
    <script src="{% static 'js/tracker.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
